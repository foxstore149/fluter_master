<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Logs — Flutter Master</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .log-list { display:flex; flex-direction:column; gap:8px; }
    .log-card {
      display:flex; gap:12px; align-items:flex-start;
      padding:12px 14px; border-radius:10px;
      border:1px solid var(--border); background:var(--card);
      border-left:3px solid var(--primary);
    }
    .log-icon { font-size:16px; flex-shrink:0; }
    .log-body { flex:1; min-width:0; }
    .log-action { font-weight:600; font-size:13px; }
    .log-time { font-size:11px; color:var(--muted); }
    .log-detail { font-size:12px; color:var(--muted); word-break:break-all; }
    .chip { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:var(--bg); border:1px solid var(--border); color:var(--muted); margin-right:6px; }
    .pagination { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .page-btns { display:flex; gap:8px; }
  </style>
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var page = 1;
    var totalPages = 1;

    requireAuth();
    document.addEventListener("auth-ready", function () {
      mountShell("Logs");
      document.getElementById("page-content").innerHTML =
        '<div class="page-header">' +
          '<div><h1>Audit log</h1><p id="count">Loading…</p></div>' +
          '<button class="btn btn-sm" type="button" id="refreshBtn">↻ Refresh</button>' +
        '</div>' +
        '<div class="log-list" id="content"><div class="empty"><span class="spinner"></span></div></div>' +
        '<div class="pagination" id="pagination"></div>';

      document.getElementById("refreshBtn").addEventListener("click", function () {
        page = 1;
        loadAudit();
      });

      loadAudit();
    });

    async function loadAudit() {
      try {
        var res = await api("/audit?page=" + page + "&pageSize=50");
        var items = res.data || [];
        var total = (res.pagination && res.pagination.total) || items.length;
        totalPages = (res.pagination && res.pagination.totalPages) || 1;
        
        document.getElementById("count").textContent = total + " entr" + (total === 1 ? "y" : "ies");
        
        if (!items.length) {
          document.getElementById("content").innerHTML = '<div class="empty">No audit entries yet.</div>';
        } else {
          document.getElementById("content").innerHTML = items.map(function (a) {
            var chips = [];
            if (a.ip) chips.push('<span class="chip">IP: ' + esc(a.ip) + '</span>');
            if (a.adminId) chips.push('<span class="chip">Admin: ' + esc(String(a.adminId).slice(0, 8)) + '</span>');
            if (a.keyId) chips.push('<span class="chip">Key: ' + esc(String(a.keyId).slice(0, 8)) + '</span>');
            var detail = "";
            if (a.details) {
              try {
                detail = typeof a.details === "string" ? a.details : JSON.stringify(a.details);
                if (detail.length > 200) detail = detail.slice(0, 200) + "…";
              } catch (e) { detail = String(a.details); }
            }
            return '<div class="log-card">' +
              '<div class="log-icon">📋</div>' +
              '<div class="log-body">' +
                '<div class="log-action">' + esc(a.action || "event") + '</div>' +
                '<div class="log-time">' + esc(formatDate(a.createdAt)) + '</div>' +
                (chips.length ? '<div style="margin-top:6px">' + chips.join("") + '</div>' : '') +
                (detail ? '<div class="log-detail" style="margin-top:6px">' + esc(detail) + '</div>' : '') +
              '</div>' +
            '</div>';
          }).join("");
        }

        document.getElementById("pagination").innerHTML = totalPages > 1
          ? '<span style="color:var(--muted);font-size:13px">Page ' + page + ' of ' + totalPages + '</span>' +
            '<div class="page-btns">' +
              '<button class="btn btn-sm" type="button" ' + (page === 1 ? "disabled" : "") + ' id="prevBtn">Previous</button>' +
              '<button class="btn btn-sm" type="button" ' + (page >= totalPages ? "disabled" : "") + ' id="nextBtn">Next</button>' +
            '</div>'
          : "";

        var prevBtn = document.getElementById("prevBtn");
        var nextBtn = document.getElementById("nextBtn");
        if (prevBtn) prevBtn.addEventListener("click", function () { if (page > 1) { page--; loadAudit(); } });
        if (nextBtn) nextBtn.addEventListener("click", function () { if (page < totalPages) { page++; loadAudit(); } });
      } catch (err) {
        document.getElementById("content").innerHTML =
          '<div class="alert alert-error">' + esc(err.message || String(err)) + '</div>';
      }
    }
  </script>
</body>
</html>
